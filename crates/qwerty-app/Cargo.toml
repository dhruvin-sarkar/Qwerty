# qwerty-app: the Windows binary — egui UI, tray, hotkeys, audio thread, and
# the PlatformActions trait + Windows implementation (ARCHITECTURE.md).
# GUI / audio / Windows dependencies are added here in the phase that needs
# them (egui/eframe in Phase 3, cpal in Phase 2, the `windows` crate in
# Phase 5) — Phase 0 keeps this a minimal binary that just links qwerty-core.
[package]
name = "qwerty-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
qwerty-core = { path = "../qwerty-core" }
cpal = { workspace = true }
rtrb = { workspace = true }
# Phase 4 — timestamps for profiles created by the calibration wizard.
chrono = { workspace = true }
# Phase 5 — action dispatch. Cross-platform action crates here; the Windows-only
# ones are under the target table below so a future Linux build still compiles.
arboard = { workspace = true }
tts = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }
winrt-toast = { workspace = true }
# Phase 3 — GUI shell, tray icon, global hotkey (ROADMAP.md).
eframe = { workspace = true }
egui = { workspace = true }
# Phase 7 polish — Phosphor icon font (vector icons in place of unicode/emoji
# glyphs). Pinned to 0.9, the release that targets egui 0.31 (0.10+ require
# egui 0.32+, which is the deliberately-deferred layout redesign). Windows-only
# like the rest of the GUI, so a future Linux build's dep graph is unaffected.
# Regular variant only: `add_to_fonts` registers under one shared "phosphor"
# font key, so a second variant would overwrite the first — one weight it is.
egui-phosphor = { version = "0.9", default-features = false, features = ["regular"] }
tray-icon = { workspace = true }
global-hotkey = { workspace = true }
