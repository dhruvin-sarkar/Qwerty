# Qwerty workspace manifest.
# Layout and the qwerty-core / qwerty-app split are defined in ARCHITECTURE.md.
[workspace]
resolver = "2"
members = ["crates/qwerty-core", "crates/qwerty-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["dhruvin-sarkar"]
repository = "https://github.com/dhruvin-sarkar/Qwerty"

# Shared dependency versions live here so both crates stay in lockstep.
# Nothing is added speculatively — each entry is introduced by the phase
# that first needs it (see ROADMAP.md).
[workspace.dependencies]
# Phase 1 — data model persistence (DATA_MODEL.md) and DSP.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }
rustfft = "6"
# Phase 2 — real audio capture (qwerty-app only; never in qwerty-core).
cpal = "0.15"
rtrb = "0.3"
# Phase 3 — GUI shell, tray, and global hotkey (qwerty-app only). eframe bundles
# egui + winit + accesskit (screen-reader support, needed in Phase 7). The glow
# (OpenGL) renderer is selected explicitly: the wgpu backend pulls in wgpu-hal,
# which fails to compile against the `windows` crate version that tray-icon /
# global-hotkey require, and glow is the lighter backend for an always-on
# background app anyway (PERFORMANCE.md).
# Pinned to the 0.31 API line: egui 0.32+ landed a large layout/app-model
# redesign (App::ui with a root Ui, SidePanel removed). Qwerty targets the
# stable 0.31 surface (App::update, SidePanel, CentralPanel); revisiting the
# redesign is a deliberate later migration, not a Phase 3 concern.
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.31"
tray-icon = "0.24"
global-hotkey = "0.8"
# Phase 5 — platform action dispatch (qwerty-app only; qwerty-core stays OS-free).
# The `windows` feature set was verified against the installed windows-0.62.2
# source (0.62 is already in the lockfile via tray-icon/global-hotkey). NOTE:
# MessageBeep lives in Win32_System_Diagnostics_Debug, not WindowsAndMessaging.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Registry",
] }
arboard = "3"
# Speech + toast, the last two ActionSpec variants. These were stubbed as
# Unsupported while the registry was unreachable; now fetched and implemented.
# `tts` wraps SAPI/WinRT on Windows and is cross-platform, so it sits with the
# other portable action crates; `winrt-toast` is Windows-only (target table).
tts = "0.26"
winrt-toast = "0.1"
